<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Eight Ball</title>
  <meta name="description" content="Ask the ball. Answers chosen by Jev, TypeSafe's System One decision model." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Magic Eight Ball</h1>
    <p class="tagline">Ask a yes-or-no question. The ball consults Jev and swirls up a reply.</p>

    <div class="stage">
      <div class="ball" id="ball">
        <div class="ball-shine"></div>
        <div class="face face-eight">
          <span>8</span>
        </div>
        <div class="face face-window">
          <div class="liquid">
            <span class="bubble b1"></span>
            <span class="bubble b2"></span>
            <span class="bubble b3"></span>
            <span class="bubble b4"></span>
            <span class="bubble b5"></span>
          </div>
          <div class="triangle" id="triangle">
            <p class="answer" id="answer"></p>
          </div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>

    <form id="form" autocomplete="off">
      <input id="question" type="text" maxlength="500" placeholder="Will it rain on Saturday?" required />
      <button id="ask" type="submit">Shake</button>
    </form>

    <p class="status" id="status" aria-live="polite"></p>

    <details class="odds" id="odds" hidden>
      <summary>How Jev weighed it</summary>
      <ol id="odds-list"></ol>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
