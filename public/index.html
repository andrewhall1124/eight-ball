<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Eight Ball</title>
  <meta name="description" content="Ask the ball. Answers chosen by Jev, TypeSafe's System One decision model." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
<pre class="title">
+----------------------+
|    MAGIC  8  BALL    |
+----------------------+
</pre>
    <p class="tagline">ask a yes/no question. jev picks the reply.</p>

    <pre id="ball" class="ball" aria-live="polite"></pre>

    <form id="form" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="question" type="text" maxlength="500" placeholder="will it rain on saturday?" required />
      <button id="ask" type="submit">[ shake ]</button>
    </form>

    <pre id="status" class="status" aria-live="polite"></pre>

    <pre id="odds" class="odds" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
